name: Update data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # Mon-Fri 22:30 UTC (after the US close)
  workflow_dispatch: {}        # "Run workflow" button to run it manually

permissions:
  contents: write

concurrency:                   # never two runs at the same time
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # always the latest main, also on "Re-run"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download FRED and CFTC data
        run: python scripts/update.py
      - name: Save data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json sim.json
          git diff --cached --quiet && exit 0
          git commit -m "Data updated $(date -u +%F)"
          git pull --rebase -X theirs origin main   # if main moved, catch up; fresh data wins
          git push
