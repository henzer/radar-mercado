name: Update data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # Mon-Fri 22:30 UTC (after the US close)
  workflow_dispatch: {}        # "Run workflow" button to run it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download FRED and CFTC data
        run: python scripts/update.py
      - name: Save data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json sim.json
          git diff --cached --quiet || git commit -m "Data updated $(date -u +%F)"
          git push
