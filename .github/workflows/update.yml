name: Actualizar datos

on:
  schedule:
    - cron: "30 22 * * 1-5"   # lun-vie 22:30 UTC (después del cierre de EE.UU.)
  workflow_dispatch: {}        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos de FRED y CFTC
        run: python scripts/update.py
      - name: Guardar data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          git push
